name: Feature request
description: Propose a language, compiler, runtime, or tooling improvement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or workflow does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the desired behavior or API.
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Example Geo code
      render: geo
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - language
        - compiler
        - runtime
        - standard-library
        - backend
        - tooling
        - documentation

