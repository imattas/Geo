name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            binary: geo
            archive: geo-linux-x86_64.tar.gz
          - name: windows-x86_64
            os: windows-latest
            binary: geo.exe
            archive: geo-windows-x86_64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build compiler
        run: cargo build --workspace --release --locked

      - name: Stage Linux artifact
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/geo
          cp target/release/${{ matrix.binary }} dist/geo/
          cp README.md STATUS.md ROADMAP.md IMPROVEMENTS.md dist/geo/
          tar -czf dist/${{ matrix.archive }} -C dist geo

      - name: Stage Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/geo | Out-Null
          Copy-Item target/release/${{ matrix.binary }} dist/geo/
          Copy-Item README.md,STATUS.md,ROADMAP.md,IMPROVEMENTS.md dist/geo/
          Compress-Archive -Path dist/geo/* -DestinationPath dist/${{ matrix.archive }}

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.name }}" dist/* \
            --title "Geo ${{ steps.tag.outputs.name }}" \
            --notes "Geo compiler release ${{ steps.tag.outputs.name }}."

