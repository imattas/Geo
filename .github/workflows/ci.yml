name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: Rust checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Validate workspace layout
        run: cargo run --locked -p xtask --quiet -- layout

      - name: Enforce from-scratch compiler policy
        run: cargo run --locked -p xtask --quiet -- from-scratch

      - name: Check Linux target
        run: cargo run --locked --quiet -- check examples/return_42.geo --target x86_64-linux

      - name: Emit Linux object
        run: cargo run --locked --quiet -- emit-obj examples/return_42.geo --target x86_64-linux -o target/ci-return-42-linux.o

      - name: Emit Windows assembly
        run: cargo run --locked --quiet -- emit-asm examples/return_42.geo --target x86_64-windows -o target/ci-return-42-windows.asm

