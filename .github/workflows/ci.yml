name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: Rust checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Validate workspace layout
        run: cargo run --locked -p xtask --quiet -- layout

      - name: Enforce from-scratch compiler policy
        run: cargo run --locked -p xtask --quiet -- from-scratch

      - name: Check Linux target
        run: cargo run --locked --quiet -- check examples/return_42.geo --target x86_64-linux

      - name: Build compiler-owned Linux executable
        run: cargo run --locked --quiet -- build examples/hello_world.geo --target x86_64-linux -o target/ci-hello-world-linux

      - name: Build compiler-owned Windows executable
        run: cargo run --locked --quiet -- build examples/hello_world.geo --target x86_64-windows -o target/ci-hello-world-windows.exe

      - name: Emit Linux object
        run: cargo run --locked --quiet -- emit-obj examples/object_backend.geo --target x86_64-linux -o target/ci-object-backend-linux.o

      - name: Emit Linux hello object
        run: cargo run --locked --quiet -- emit-obj examples/hello_world.geo --target x86_64-linux -o target/ci-hello-world-linux.o

      - name: Emit Windows COFF object
        run: cargo run --locked --quiet -- emit-obj examples/coff_backend.geo --target x86_64-windows -o target/ci-coff-backend-windows.obj

      - name: Emit Windows assembly
        run: cargo run --locked --quiet -- emit-asm examples/return_42.geo --target x86_64-windows -o target/ci-return-42-windows.asm
