name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: Rust checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Validate workspace layout
        run: cargo run --locked -p xtask --quiet -- layout

      - name: Enforce from-scratch compiler policy
        run: cargo run --locked -p xtask --quiet -- from-scratch

      - name: Check Linux target
        run: cargo run --locked --quiet -- check examples/return_42.geo --target x86_64-linux

      - name: Build compiler-owned Linux executable
        run: cargo run --locked --quiet -- build examples/hello_world.geo --target x86_64-linux -o target/ci-hello-world-linux

      - name: Build compiler-owned Linux read executable
        run: cargo run --locked --quiet -- build examples/read_file_len_exit.geo --target x86_64-linux -o target/ci-read-file-linux
      - name: Build compiler-owned Linux read-free executable
        run: cargo run --locked --quiet -- build examples/read_file_free_exit.geo --target x86_64-linux -o target/ci-read-file-free-linux

      - name: Build compiler-owned Linux read-default executable
        run: cargo run --locked --quiet -- build examples/read_file_or_len_exit.geo --target x86_64-linux -o target/ci-read-file-or-linux

      - name: Build compiler-owned Linux read-line executable
        run: cargo run --locked --quiet -- build examples/read_line_len_exit.geo --target x86_64-linux -o target/ci-read-line-linux
      - name: Build compiler-owned Linux read-line-free executable
        run: cargo run --locked --quiet -- build examples/read_line_free_exit.geo --target x86_64-linux -o target/ci-read-line-free-linux

      - name: Build compiler-owned Linux memory executable
        run: cargo run --locked --quiet -- build examples/mem_runtime_exit.geo --target x86_64-linux -o target/ci-memory-linux

      - name: Build compiler-owned Linux byte-string executable
        run: cargo run --locked --quiet -- build examples/string_from_byte_len_exit.geo --target x86_64-linux -o target/ci-string-from-byte-linux

      - name: Build compiler-owned Linux byte-string-free executable
        run: cargo run --locked --quiet -- build examples/string_from_byte_free_exit.geo --target x86_64-linux -o target/ci-string-from-byte-free-linux
      - name: Build compiler-owned Linux UTF-8 conversion executable
        run: cargo run --locked --quiet -- build examples/string_from_utf8_codepoint_exit.geo --target x86_64-linux -o target/ci-string-from-utf8-codepoint-linux

      - name: Build compiler-owned Linux string-clone executable
        run: cargo run --locked --quiet -- build examples/string_clone_len_exit.geo --target x86_64-linux -o target/ci-string-clone-linux

      - name: Build compiler-owned Linux string-clone-free executable
        run: cargo run --locked --quiet -- build examples/string_clone_free_exit.geo --target x86_64-linux -o target/ci-string-clone-free-linux

      - name: Build compiler-owned Linux alloc-copy executable
        run: cargo run --locked --quiet -- build examples/alloc_copy_exit.geo --target x86_64-linux -o target/ci-alloc-copy-linux

      - name: Build compiler-owned Linux alloc-free executable
        run: cargo run --locked --quiet -- build examples/alloc_free_exit.geo --target x86_64-linux -o target/ci-alloc-free-linux

      - name: Build compiler-owned Linux alloc-realloc executable
        run: cargo run --locked --quiet -- build examples/alloc_realloc_exit.geo --target x86_64-linux -o target/ci-alloc-realloc-linux

      - name: Build compiler-owned Linux alloc-copy-free executable
        run: cargo run --locked --quiet -- build examples/alloc_copy_free_exit.geo --target x86_64-linux -o target/ci-alloc-copy-free-linux

      - name: Build compiler-owned Linux mem-fill executable
        run: cargo run --locked --quiet -- build examples/mem_fill_exit.geo --target x86_64-linux -o target/ci-mem-fill-linux

      - name: Build compiler-owned Linux mem-compare executable
        run: cargo run --locked --quiet -- build examples/mem_compare_exit.geo --target x86_64-linux -o target/ci-mem-compare-linux

      - name: Build compiler-owned Linux memory-predicates executable
        run: cargo run --locked --quiet -- build examples/mem_predicates_exit.geo --target x86_64-linux -o target/ci-mem-predicates-linux
      - name: Build compiler-owned Linux memory-reordering executable
