name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: Rust checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Validate workspace layout
        run: cargo run --locked -p xtask --quiet -- layout

      - name: Enforce from-scratch compiler policy
        run: cargo run --locked -p xtask --quiet -- from-scratch

      - name: Check Linux target
        run: cargo run --locked --quiet -- check examples/return_42.geo --target x86_64-linux

      - name: Build compiler-owned Linux executable
        run: cargo run --locked --quiet -- build examples/hello_world.geo --target x86_64-linux -o target/ci-hello-world-linux

      - name: Build compiler-owned Linux read executable
        run: cargo run --locked --quiet -- build examples/read_file_len_exit.geo --target x86_64-linux -o target/ci-read-file-linux

      - name: Build compiler-owned Linux read-default executable
        run: cargo run --locked --quiet -- build examples/read_file_or_len_exit.geo --target x86_64-linux -o target/ci-read-file-or-linux

      - name: Build compiler-owned Linux read-line executable
        run: cargo run --locked --quiet -- build examples/read_line_len_exit.geo --target x86_64-linux -o target/ci-read-line-linux

      - name: Build compiler-owned Linux memory executable
        run: cargo run --locked --quiet -- build examples/mem_runtime_exit.geo --target x86_64-linux -o target/ci-memory-linux

      - name: Build compiler-owned Linux byte-string executable
        run: cargo run --locked --quiet -- build examples/string_from_byte_len_exit.geo --target x86_64-linux -o target/ci-string-from-byte-linux

      - name: Build compiler-owned Linux string-clone executable
        run: cargo run --locked --quiet -- build examples/string_clone_len_exit.geo --target x86_64-linux -o target/ci-string-clone-linux

      - name: Build compiler-owned Linux alloc-copy executable
        run: cargo run --locked --quiet -- build examples/alloc_copy_exit.geo --target x86_64-linux -o target/ci-alloc-copy-linux

      - name: Build compiler-owned Linux mem-fill executable
        run: cargo run --locked --quiet -- build examples/mem_fill_exit.geo --target x86_64-linux -o target/ci-mem-fill-linux

      - name: Build compiler-owned Linux mem-compare executable
        run: cargo run --locked --quiet -- build examples/mem_compare_exit.geo --target x86_64-linux -o target/ci-mem-compare-linux

      - name: Build compiler-owned Linux memory-predicates executable
        run: cargo run --locked --quiet -- build examples/mem_predicates_exit.geo --target x86_64-linux -o target/ci-mem-predicates-linux
      - name: Build compiler-owned Linux memory-reordering executable
        run: cargo run --locked --quiet -- build examples/mem_reorder_exit.geo --target x86_64-linux -o target/ci-mem-reorder-linux
      - name: Build compiler-owned Linux file-write executable
        run: cargo run --locked --quiet -- build examples/write_file_exit.geo --target x86_64-linux -o target/ci-write-file-linux
      - name: Build compiler-owned Linux append executable
        run: cargo run --locked --quiet -- build examples/append_file_exit.geo --target x86_64-linux -o target/ci-append-file-linux
      - name: Build compiler-owned Linux touch/remove executable
        run: cargo run --locked --quiet -- build examples/touch_remove_file_exit.geo --target x86_64-linux -o target/ci-touch-remove-file-linux
      - name: Build compiler-owned Linux handle-file executable
        run: cargo run --locked --quiet -- build examples/file_handle_exit.geo --target x86_64-linux -o target/ci-file-handle-linux
      - name: Build compiler-owned Linux append-handle executable
        run: cargo run --locked --quiet -- build examples/file_append_handle_exit.geo --target x86_64-linux -o target/ci-file-append-handle-linux
      - name: Build compiler-owned Linux handle-read executable
        run: cargo run --locked --quiet -- build examples/file_read_handle_len_exit.geo --target x86_64-linux -o target/ci-file-read-handle-linux
      - name: Build compiler-owned Linux file-exists executable
        run: cargo run --locked --quiet -- build examples/file_exists_exit.geo --target x86_64-linux -o target/ci-file-exists-linux
      - name: Build compiler-owned Linux file-metadata executable
        run: cargo run --locked --quiet -- build examples/file_metadata_exit.geo --target x86_64-linux -o target/ci-file-metadata-linux

      - name: Build compiler-owned Windows executable
        run: cargo run --locked --quiet -- build examples/hello_world.geo --target x86_64-windows -o target/ci-hello-world-windows.exe

      - name: Build compiler-owned Windows read executable
        run: cargo run --locked --quiet -- build examples/read_file_len_windows_exit.geo --target x86_64-windows -o target/ci-read-file-windows.exe

      - name: Build compiler-owned Windows read-default executable
        run: cargo run --locked --quiet -- build examples/read_file_or_len_windows_exit.geo --target x86_64-windows -o target/ci-read-file-or-windows.exe

      - name: Build compiler-owned Windows read-line executable
        run: cargo run --locked --quiet -- build examples/read_line_len_windows_exit.geo --target x86_64-windows -o target/ci-read-line-windows.exe

      - name: Build compiler-owned Windows memory executable
        run: cargo run --locked --quiet -- build examples/mem_runtime_exit.geo --target x86_64-windows -o target/ci-memory-windows.exe

      - name: Build compiler-owned Windows byte-string executable
        run: cargo run --locked --quiet -- build examples/string_from_byte_len_exit.geo --target x86_64-windows -o target/ci-string-from-byte-windows.exe

      - name: Build compiler-owned Windows string-clone executable
        run: cargo run --locked --quiet -- build examples/string_clone_len_exit.geo --target x86_64-windows -o target/ci-string-clone-windows.exe

      - name: Build compiler-owned Windows alloc-copy executable
        run: cargo run --locked --quiet -- build examples/alloc_copy_exit.geo --target x86_64-windows -o target/ci-alloc-copy-windows.exe

      - name: Build compiler-owned Windows mem-fill executable
        run: cargo run --locked --quiet -- build examples/mem_fill_exit.geo --target x86_64-windows -o target/ci-mem-fill-windows.exe

      - name: Build compiler-owned Windows mem-compare executable
        run: cargo run --locked --quiet -- build examples/mem_compare_exit.geo --target x86_64-windows -o target/ci-mem-compare-windows.exe

      - name: Build compiler-owned Windows memory-predicates executable
        run: cargo run --locked --quiet -- build examples/mem_predicates_exit.geo --target x86_64-windows -o target/ci-mem-predicates-windows.exe
      - name: Build compiler-owned Windows memory-reordering executable
        run: cargo run --locked --quiet -- build examples/mem_reorder_exit.geo --target x86_64-windows -o target/ci-mem-reorder-windows.exe
      - name: Build compiler-owned Windows file-write executable
        run: cargo run --locked --quiet -- build examples/write_file_exit.geo --target x86_64-windows -o target/ci-write-file-windows.exe
      - name: Build compiler-owned Windows append executable
        run: cargo run --locked --quiet -- build examples/append_file_exit.geo --target x86_64-windows -o target/ci-append-file-windows.exe
      - name: Build compiler-owned Windows touch/remove executable
        run: cargo run --locked --quiet -- build examples/touch_remove_file_exit.geo --target x86_64-windows -o target/ci-touch-remove-file-windows.exe
      - name: Build compiler-owned Windows handle-file executable
        run: cargo run --locked --quiet -- build examples/file_handle_exit.geo --target x86_64-windows -o target/ci-file-handle-windows.exe
      - name: Build compiler-owned Windows append-handle executable
        run: cargo run --locked --quiet -- build examples/file_append_handle_exit.geo --target x86_64-windows -o target/ci-file-append-handle-windows.exe
      - name: Build compiler-owned Windows handle-read executable
        run: cargo run --locked --quiet -- build examples/file_read_handle_len_exit.geo --target x86_64-windows -o target/ci-file-read-handle-windows.exe
      - name: Build compiler-owned Windows file-exists executable
        run: cargo run --locked --quiet -- build examples/file_exists_exit.geo --target x86_64-windows -o target/ci-file-exists-windows.exe
      - name: Build compiler-owned Windows file-metadata executable
        run: cargo run --locked --quiet -- build examples/file_metadata_exit.geo --target x86_64-windows -o target/ci-file-metadata-windows.exe

      - name: Build v1 buffer example with direct Linux writer
        run: cargo run --locked --quiet -- build examples/v1/buffer.geo --target x86_64-linux -o target/ci-v1-buffer-linux
      - name: Build v1 lexer example with direct Linux writer
        run: cargo run --locked --quiet -- build examples/v1/lexer.geo --target x86_64-linux -o target/ci-v1-lexer-linux
      - name: Build v1 diagnostics example with direct Linux writer
        run: cargo run --locked --quiet -- build examples/v1/diagnostics.geo --target x86_64-linux -o target/ci-v1-diagnostics-linux
      - name: Build v1 AST example with direct Linux writer
        run: cargo run --locked --quiet -- build examples/v1/ast.geo --target x86_64-linux -o target/ci-v1-ast-linux
      - name: Build v1 file echo example with direct Linux writer
        run: cargo run --locked --quiet -- build examples/v1/file_echo.geo --target x86_64-linux -o target/ci-v1-file-echo-linux
      - name: Build v1 parser example with direct Linux writer
        run: cargo run --locked --quiet -- build examples/v1/mini_parser.geo --target x86_64-linux -o target/ci-v1-mini-parser-linux
      - name: Build v1 buffer example with direct Windows writer
        run: cargo run --locked --quiet -- build examples/v1/buffer.geo --target x86_64-windows -o target/ci-v1-buffer-windows.exe
      - name: Build v1 lexer example with direct Windows writer
        run: cargo run --locked --quiet -- build examples/v1/lexer.geo --target x86_64-windows -o target/ci-v1-lexer-windows.exe
      - name: Build v1 diagnostics example with direct Windows writer
        run: cargo run --locked --quiet -- build examples/v1/diagnostics.geo --target x86_64-windows -o target/ci-v1-diagnostics-windows.exe
      - name: Build v1 AST example with direct Windows writer
        run: cargo run --locked --quiet -- build examples/v1/ast.geo --target x86_64-windows -o target/ci-v1-ast-windows.exe
      - name: Build v1 file echo example with direct Windows writer
        run: cargo run --locked --quiet -- build examples/v1/file_echo.geo --target x86_64-windows -o target/ci-v1-file-echo-windows.exe
      - name: Build v1 parser example with direct Windows writer
        run: cargo run --locked --quiet -- build examples/v1/mini_parser.geo --target x86_64-windows -o target/ci-v1-mini-parser-windows.exe

      - name: Emit Linux object
        run: cargo run --locked --quiet -- emit-obj examples/object_backend.geo --target x86_64-linux -o target/ci-object-backend-linux.o

      - name: Emit Linux hello object
        run: cargo run --locked --quiet -- emit-obj examples/hello_world.geo --target x86_64-linux -o target/ci-hello-world-linux.o

      - name: Emit Windows COFF object
        run: cargo run --locked --quiet -- emit-obj examples/coff_backend.geo --target x86_64-windows -o target/ci-coff-backend-windows.obj

      - name: Emit Windows assembly
        run: cargo run --locked --quiet -- emit-asm examples/return_42.geo --target x86_64-windows -o target/ci-return-42-windows.asm
