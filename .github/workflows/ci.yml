          test ! -e target/geo-copy-source.txt
          test ! -e target/geo-copy-dest.txt
          test "$status" -eq 0
      - name: Execute compiler-owned Linux timestamp executable
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set +e
