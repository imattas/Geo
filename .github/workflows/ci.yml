      - name: Build compiler-owned Linux directory executable
        run: cargo run --locked --quiet -- build examples/directory_mutation_exit.geo --target x86_64-linux -o target/ci-directory-mutation-linux
      - name: Build compiler-owned Linux rename executable
        run: cargo run --locked --quiet -- build examples/rename_file_exit.geo --target x86_64-linux -o target/ci-rename-file-linux
      - name: Build compiler-owned Linux copy executable
        run: cargo run --locked --quiet -- build examples/copy_file_exit.geo --target x86_64-linux -o target/ci-copy-file-linux
      - name: Build compiler-owned Linux timestamp executable
        run: cargo run --locked --quiet -- build examples/file_timestamps_exit.geo --target x86_64-linux -o target/ci-file-timestamps-linux
      - name: Build compiler-owned Linux directory-count executable
        run: cargo run --locked --quiet -- build examples/dir_entry_count_exit.geo --target x86_64-linux -o target/ci-dir-entry-count-linux
      - name: Build compiler-owned Linux directory-name executable
        run: cargo run --locked --quiet -- build examples/dir_entry_name_exit.geo --target x86_64-linux -o target/ci-dir-entry-name-linux
      - name: Build compiler-owned Linux directory-path executable
        run: cargo run --locked --quiet -- build examples/dir_entry_path_exit.geo --target x86_64-linux -o target/ci-dir-entry-path-linux
      - name: Execute compiler-owned Linux truncate executable
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set +e
          chmod +x target/ci-truncate-file-linux
          target/ci-truncate-file-linux
          status=$?
          rm -f target/geo-truncate-file.txt
          test "$status" -eq 3
      - name: Execute compiler-owned Linux seek executable
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set +e
          chmod +x target/ci-file-seek-linux
          target/ci-file-seek-linux
          status=$?
          content=$(cat target/geo-seek-test.txt)
          rm -f target/geo-seek-test.txt
          test "$status" -eq 0
          test "$content" = "abZdef"
      - name: Execute compiler-owned Linux flush executable
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set +e
          chmod +x target/ci-file-flush-linux
          target/ci-file-flush-linux
          status=$?
          size=$(wc -c < target/geo-flush-test.txt)
          rm -f target/geo-flush-test.txt
          test "$status" -eq 0
          test "$size" -eq 7
      - name: Execute compiler-owned Linux directory executable
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set +e
          chmod +x target/ci-directory-mutation-linux
          target/ci-directory-mutation-linux
          status=$?
          test ! -e target/geo-directory-test
          test "$status" -eq 0
      - name: Execute compiler-owned Linux rename executable
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set +e
          chmod +x target/ci-rename-file-linux
          target/ci-rename-file-linux
          status=$?
          test ! -e target/geo-rename-source.txt
          test ! -e target/geo-rename-dest.txt
          test "$status" -eq 0
      - name: Execute compiler-owned Linux copy executable
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set +e
