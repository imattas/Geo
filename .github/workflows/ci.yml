  pe64-windows-smoke:
    name: PE64 execution smoke (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build native PE64 smoke fixtures
        shell: pwsh
        run: |
          cargo run --locked --quiet -- build examples/hello_world.geo --target x86_64-windows -o target/ci-smoke-hello.exe
          cargo run --locked --quiet -- build examples/string_clone_len_exit.geo --target x86_64-windows -o target/ci-smoke-clone-len.exe
          cargo run --locked --quiet -- build examples/string_clone_free_exit.geo --target x86_64-windows -o target/ci-smoke-clone-free.exe
          cargo run --locked --quiet -- build examples/string_concat_free_exit.geo --target x86_64-windows -o target/ci-smoke-concat-free.exe
          cargo run --locked --quiet -- build examples/string_slice_free_exit.geo --target x86_64-windows -o target/ci-smoke-slice-free.exe
          cargo run --locked --quiet -- build examples/read_file_free_windows_exit.geo --target x86_64-windows -o target/ci-smoke-read-free.exe
          cargo run --locked --quiet -- build examples/file_read_handle_free_exit.geo --target x86_64-windows -o target/ci-smoke-handle-read-free.exe
          cargo run --locked --quiet -- build examples/string_from_utf8_codepoint_exit.geo --target x86_64-windows -o target/ci-smoke-from-utf8.exe
          cargo run --locked --quiet -- build examples/array_runtime_exit.geo --target x86_64-windows -o target/ci-smoke-array-runtime.exe
          cargo run --locked --quiet -- build examples/array_lifecycle_exit.geo --target x86_64-windows -o target/ci-smoke-array-lifecycle.exe
          cargo run --locked --quiet -- build examples/array_mutation_exit.geo --target x86_64-windows -o target/ci-smoke-array-mutation.exe
          cargo run --locked --quiet -- build examples/array_typed_composition_exit.geo --target x86_64-windows -o target/ci-smoke-array-typed-composition.exe
          cargo run --locked --quiet -- build examples/array_resize_exit.geo --target x86_64-windows -o target/ci-smoke-array-resize.exe
          cargo run --locked --quiet -- build examples/array_typed_search_exit.geo --target x86_64-windows -o target/ci-smoke-array-typed-search.exe
          cargo run --locked --quiet -- build examples/truncate_file_exit.geo --target x86_64-windows -o target/ci-smoke-truncate-file.exe
          cargo run --locked --quiet -- build examples/file_seek_exit.geo --target x86_64-windows -o target/ci-smoke-file-seek.exe
          cargo run --locked --quiet -- build examples/file_flush_exit.geo --target x86_64-windows -o target/ci-smoke-file-flush.exe
          cargo run --locked --quiet -- build examples/directory_mutation_exit.geo --target x86_64-windows -o target/ci-smoke-directory-mutation.exe
          cargo run --locked --quiet -- build examples/rename_file_exit.geo --target x86_64-windows -o target/ci-smoke-rename-file.exe
          cargo run --locked --quiet -- build examples/copy_file_exit.geo --target x86_64-windows -o target/ci-smoke-copy-file.exe
          cargo run --locked --quiet -- build examples/file_timestamps_exit.geo --target x86_64-windows -o target/ci-smoke-file-timestamps.exe
          cargo run --locked --quiet -- build examples/dir_entry_count_exit.geo --target x86_64-windows -o target/ci-smoke-dir-entry-count.exe
          cargo run --locked --quiet -- build examples/dir_entry_name_exit.geo --target x86_64-windows -o target/ci-smoke-dir-entry-name.exe
          cargo run --locked --quiet -- build examples/dir_entry_path_exit.geo --target x86_64-windows -o target/ci-smoke-dir-entry-path.exe

      - name: Execute native PE64 smoke fixtures
        shell: pwsh
        run: |
          & target/ci-smoke-hello.exe
          Write-Host "hello status=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & target/ci-smoke-clone-len.exe
          Write-Host "clone-len status=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 3) { exit $LASTEXITCODE }
          & target/ci-smoke-clone-free.exe
          Write-Host "clone-free status=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & target/ci-smoke-concat-free.exe
          Write-Host "concat-free status=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & target/ci-smoke-slice-free.exe
          Write-Host "slice-free status=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & target/ci-smoke-read-free.exe
          Write-Host "read-free status=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & target/ci-smoke-handle-read-free.exe
          Write-Host "handle-read-free status=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & target/ci-smoke-from-utf8.exe
          Write-Host "from-utf8 status=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & target/ci-smoke-array-runtime.exe
          Write-Host "array-runtime status=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & target/ci-smoke-array-lifecycle.exe
          Write-Host "array-lifecycle status=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & target/ci-smoke-array-mutation.exe
          Write-Host "array-mutation status=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & target/ci-smoke-array-typed-composition.exe
          Write-Host "array-typed-composition status=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & target/ci-smoke-array-resize.exe
          Write-Host "array-resize status=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & target/ci-smoke-array-typed-search.exe
          Write-Host "array-typed-search status=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & target/ci-smoke-truncate-file.exe
          $truncateStatus = $LASTEXITCODE
          $truncateSize = (Get-Item target/geo-truncate-file.txt).Length
          Write-Host "truncate status=$truncateStatus size=$truncateSize"
          if ($truncateStatus -ne 3 -or $truncateSize -ne 3) { exit 1 }
          Remove-Item -Force target/geo-truncate-file.txt
          & target/ci-smoke-file-seek.exe
          $seekStatus = $LASTEXITCODE
          $seekContent = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes('target/geo-seek-test.txt'))
          Write-Host "seek status=$seekStatus content=$seekContent"
          if ($seekStatus -ne 0 -or $seekContent -ne 'abZdef') { exit 1 }
          Remove-Item -Force target/geo-seek-test.txt
          & target/ci-smoke-file-flush.exe
          $flushStatus = $LASTEXITCODE
          $flushSize = (Get-Item target/geo-flush-test.txt).Length
          Write-Host "flush status=$flushStatus size=$flushSize"
          if ($flushStatus -ne 0 -or $flushSize -ne 7) { exit 1 }
          Remove-Item -Force target/geo-flush-test.txt
          & target/ci-smoke-directory-mutation.exe
          $directoryStatus = $LASTEXITCODE
          $directoryExists = Test-Path target/geo-directory-test
          Write-Host "directory status=$directoryStatus exists=$directoryExists"
          if ($directoryStatus -ne 0 -or $directoryExists) { exit 1 }
          & target/ci-smoke-rename-file.exe
          $renameStatus = $LASTEXITCODE
          $renameSourceExists = Test-Path target/geo-rename-source.txt
          $renameDestExists = Test-Path target/geo-rename-dest.txt
          Write-Host "rename status=$renameStatus source=$renameSourceExists dest=$renameDestExists"
          if ($renameStatus -ne 0 -or $renameSourceExists -or $renameDestExists) { exit 1 }
          & target/ci-smoke-copy-file.exe
          $copyStatus = $LASTEXITCODE
          $copySourceExists = Test-Path target/geo-copy-source.txt
          $copyDestExists = Test-Path target/geo-copy-dest.txt
          Write-Host "copy status=$copyStatus source=$copySourceExists dest=$copyDestExists"
          if ($copyStatus -ne 0 -or $copySourceExists -or $copyDestExists) { exit 1 }
          & target/ci-smoke-file-timestamps.exe
          $timestampStatus = $LASTEXITCODE
          $timestampExists = Test-Path target/geo-file-timestamps.txt
          Write-Host "timestamps status=$timestampStatus exists=$timestampExists"
          if ($timestampStatus -ne 0 -or $timestampExists) { exit 1 }
          & target/ci-smoke-dir-entry-count.exe
          $directoryCountStatus = $LASTEXITCODE
          $directoryCountExists = Test-Path target/geo-dir-count-test
          Write-Host "directory-count status=$directoryCountStatus exists=$directoryCountExists"
          if ($directoryCountStatus -ne 0 -or $directoryCountExists) { exit 1 }
          & target/ci-smoke-dir-entry-name.exe
          $directoryNameStatus = $LASTEXITCODE
          $directoryNameExists = Test-Path target/geo-dir-name-test
          Write-Host "directory-name status=$directoryNameStatus exists=$directoryNameExists"
          if ($directoryNameStatus -ne 0 -or $directoryNameExists) { exit 1 }
          & target/ci-smoke-dir-entry-path.exe
          $directoryPathStatus = $LASTEXITCODE
          $directoryPathExists = Test-Path target/geo-dir-path-test
          Write-Host "directory-path status=$directoryPathStatus exists=$directoryPathExists"
          if ($directoryPathStatus -ne 0 -or $directoryPathExists) { exit 1 }
          exit 0
